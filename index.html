<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halterofilia · Selección</title>
<meta name="description" content="Registro de entrenamientos de la selección de halterofilia.">
<meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E8ECF1" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Halterofilia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Esta aplicación necesita JavaScript activado.</p></noscript>

<!-- Pantallas de ingreso, solicitud de acceso y espera de aprobación (las dibuja cloud.js) -->
<div id="gate" class="wrap gate" hidden></div>

<!-- La aplicación de entrenamiento (solo se muestra con sesión iniciada y acceso aprobado) -->
<div id="appRoot" hidden>
  <div class="app wrap">
    <header class="top">
      <div class="brand"><span class="brand-plate" aria-hidden="true"></span><span class="brand-name">Halterofilia</span></div>
      <button class="icon-btn" id="gear" data-act="settings" aria-label="Ajustes"></button>
    </header>
    <div id="banner"></div>
    <main id="view"></main>
  </div>
  <div id="bar">
    <div id="dock"></div>
    <nav id="nav" aria-label="Secciones"></nav>
  </div>
</div>
<dialog id="dlg" aria-label="Panel"></dialog>
<div id="toast" popover="manual" role="status" aria-live="polite" hidden></div>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
<script src="plan-import.js"></script>
<script src="plan-ui.js"></script>
<script src="assign.js"></script>
<script src="cloud.js"></script>
</body>
</html>
